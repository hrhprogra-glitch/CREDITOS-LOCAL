<section class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1>{{vgACCION_TEXTO}}</h1>
            </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                    <li class="breadcrumb-item"><a href="#">Home</a></li>
                    <li class="breadcrumb-item active">Acceso Cierre Caja</li>
                </ol>
            </div>
        </div>
    </div><!-- /.container-fluid -->
</section>
<!-- SELECT2 EXAMPLE -->
<div class="card card-default">
    <div class="card-header">
        <h3 class="card-title">{{vgACCION_TEXTO}}</h3>
    </div>
    <!-- /.card-header -->
    <div class="card-body">
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label>Usuario:</label>
                    <input type="text" class="form-control" id="txtUsuarioAccesoCierre" placeholder="Ingrese usuario"
                        autocomplete="nope" maxlength="20" #txtUsuarioAccesoCierre>
                </div>
            </div>

            <div class="col-md-6">
                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" class="form-control" id="txtPasswordAccesoCierre" placeholder="Ingrese Password"
                        autocomplete="nope" maxlength="20" #txtPasswordAccesoCierre>
                </div>
            </div>

        </div>
    </div>
    <!-- /.card-body -->
    <div class="card-footer">
        <button type="button" class="btn btn-info float-right" (click)="onClickAccesoCierreCaja(txtUsuarioAccesoCierre.value, txtPasswordAccesoCierre.value)">CONTINUAR</button>
    </div>
</div>
<!-- /.card -->
