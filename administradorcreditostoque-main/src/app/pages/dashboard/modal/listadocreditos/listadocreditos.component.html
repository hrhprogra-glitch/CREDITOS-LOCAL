<div class="modal fade" id="mListaCreditosDashboard">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Listado de Créditos</h4>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-12">
                        <table id="dtListadoCreditoModal" datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger"
                            class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Crédito ID</th>
                                    <th>Cliente</th>
                                    <th>Vencimiento</th>
                                    <th>Estado</th>
                                    <th>Crédito</th>
                                    <th>Saldo</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let creven of listarCreditoPorEstado let i = index">
                                    <td>CRE-{{creven.COD_CRE}}</td>
                                    <td>{{creven.CLI}}</td>
                                    <td>{{creven.FI}} - {{creven.FF}}</td>
                                    <td>
                                        <span [ngClass]="creven.ECC">{{creven.ESTADO}}</span> 
                                    </td>
                                    <td>
                                        <small class="text-info mr-1">
                                            <i class="far fa-money-bill-alt"></i>
                                        </small>
                                        {{creven.MONT_CRE}}
                                    </td>
                                    <td>
                                        <small class="text-danger mr-1">
                                            <i class="fas fa-arrow-down"></i>
                                        </small>
                                        {{creven.MONP}}
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>


                </div>

            </div>
            <div class="modal-footer justify-content-between">
            </div>
        </div>
        <!-- /.modal-content -->
    </div>
    <!-- /.modal-dialog -->
</div>
